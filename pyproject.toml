[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workspace-migration-agent"
version = "0.3.0"
description = "Controlled classic-to-serverless migration assessment and validation"
requires-python = ">=3.10"
dependencies = ["databricks-sdk>=0.104.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
